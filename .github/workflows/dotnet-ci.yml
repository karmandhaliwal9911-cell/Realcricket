# ---------------------------------------------------------------------------
# RealCricket — CI for the engine-free simulation core.
#
# Runs only the parts of the project that need no Unity license and no
# Android toolchain: restore, build, test RealCricket.sln, then prove the
# compiled RealCricket.Core assembly does not reference Unity.
# Standard GitHub-hosted runners only; no paid services, no secrets.
# ---------------------------------------------------------------------------
name: dotnet-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# One run per branch/PR at a time; a newer push cancels the stale run.
concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (net10.0 + netstandard2.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      # The runner has 4 GB of RAM per core; keep the GC out of server mode.
      DOTNET_gcServer: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The exact SDK is pinned in global.json (rollForward: disable).
      - name: Set up .NET SDK 10.0.404
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"

      - name: Confirm SDK version
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Restore
        run: dotnet restore RealCricket.sln --nologo

      - name: Build
        run: >-
          dotnet build RealCricket.sln
          --configuration Release
          --no-restore
          --nologo
          -maxcpucount:1
          -p:UseSharedCompilation=false

      - name: Test
        run: >-
          dotnet test RealCricket.sln
          --configuration Release
          --no-build
          --nologo
          -maxcpucount:1
          --logger "console;verbosity=normal"
          -- NUnit.NumberOfTestWorkers=1

      - name: Engine-independence guard
        run: bash tools/dev/check-engine-independence.sh --configuration Release
